<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">Agent 授权链：从 Principal 与 Task 到受控 Effect</title>
  <desc id="desc">图分为三层。上层把 Subject、Actor、Task Contract 与 Activation Grant 绑定到候选动作；中层展示 Policy、Capability、Approval 和 Credential 在执行点共同形成授权决定，再由 Harness 产生可审计副作用；下层展示委派只能收窄 Capability，以及撤销如何传播到后代 Grant、决策缓存和活跃 Run，并对在途动作执行协调。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42423e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a43b32"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .frame { fill: #f7f7f5; stroke: #a8a8a1; stroke-width: 2; stroke-dasharray: 8 8; }
      .box { fill: #ffffff; stroke: #181816; stroke-width: 2; }
      .soft { fill: #eeeeea; stroke: #181816; stroke-width: 2; }
      .active { fill: #181816; stroke: #181816; stroke-width: 2; }
      .danger { fill: #fff2ef; stroke: #a43b32; stroke-width: 2; }
      .success { fill: #edf6ef; stroke: #376a42; stroke-width: 2; }
      .label { fill: #181816; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label-light { fill: #ffffff; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .sub { fill: #6d6d67; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .sub-light { fill: #deded8; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .frame-label { fill: #6d6d67; font: 600 15px "IBM Plex Mono", monospace; letter-spacing: .04em; }
      .edge { fill: none; stroke: #42423e; stroke-width: 2.4; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #6d6d67; stroke-width: 2.1; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .edge-red { fill: none; stroke: #a43b32; stroke-width: 2.4; marker-end: url(#arrow-red); }
      .edge-red-dashed { fill: none; stroke: #a43b32; stroke-width: 2.1; stroke-dasharray: 7 6; marker-end: url(#arrow-red); }
      .edge-label { fill: #6d6d67; font: 12px "IBM Plex Mono", monospace; text-anchor: middle; }
      .edge-label-red { fill: #a43b32; font: 12px "IBM Plex Mono", monospace; text-anchor: middle; }
      .note { fill: #42423e; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note-strong { fill: #181816; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="980" rx="18"/>

  <rect class="frame" x="35" y="30" width="1210" height="245" rx="24"/>
  <text class="frame-label" x="65" y="65">IDENTITY AND INTENT · WHO ACTS FOR WHOM, UNDER WHICH TASK</text>

  <rect class="box" x="65" y="103" width="190" height="92" rx="14"/>
  <text class="label" x="160" y="135">Subject Principal</text>
  <text class="sub" x="160" y="160">resource owner / requester</text>
  <text class="sub" x="160" y="180">最终代表谁</text>

  <rect class="box" x="305" y="103" width="190" height="92" rx="14"/>
  <text class="label" x="400" y="135">Actor Principal</text>
  <text class="sub" x="400" y="160">runtime / agent / service</text>
  <text class="sub" x="400" y="180">实际由谁行动</text>

  <rect class="soft" x="545" y="92" width="210" height="114" rx="14"/>
  <text class="label" x="650" y="126">Task Contract</text>
  <text class="sub" x="650" y="151">goal · scope · invariants</text>
  <text class="sub" x="650" y="174">contract version</text>
  <text class="sub" x="650" y="194">想改变什么世界</text>

  <rect class="active" x="805" y="92" width="210" height="114" rx="14"/>
  <text class="label-light" x="910" y="126">Activation Grant</text>
  <text class="sub-light" x="910" y="151">trigger · principal · task</text>
  <text class="sub-light" x="910" y="174">capability reference</text>
  <text class="sub-light" x="910" y="194">为什么现在可启动</text>

  <rect class="box" x="1065" y="103" width="145" height="92" rx="14"/>
  <text class="label" x="1137" y="135">Candidate</text>
  <text class="label" x="1137" y="157">Action</text>
  <text class="sub" x="1137" y="180">尚未产生 Effect</text>

  <path class="edge" d="M 255 149 L 304 149"/>
  <path class="edge" d="M 495 149 L 544 149"/>
  <path class="edge" d="M 755 149 L 804 149"/>
  <path class="edge" d="M 1015 149 L 1064 149"/>
  <text class="note" x="65" y="235">控制权可以产生候选动作；Principal、Task 与 Activation 只建立决策上下文，还没有授权真实副作用。</text>

  <rect class="frame" x="35" y="305" width="1210" height="370" rx="24"/>
  <text class="frame-label" x="65" y="340">AUTHORIZATION AND ENFORCEMENT · EVERY REQUIRED CONDITION MUST HOLD</text>

  <rect class="box" x="70" y="385" width="190" height="78" rx="13"/>
  <text class="label" x="165" y="415">Policy</text>
  <text class="sub" x="165" y="440">allow · deny · obligation</text>

  <rect class="box" x="70" y="485" width="190" height="78" rx="13"/>
  <text class="label" x="165" y="515">Capability</text>
  <text class="sub" x="165" y="540">action · resource · limits</text>

  <rect class="box" x="70" y="585" width="190" height="62" rx="13"/>
  <text class="label" x="165" y="612">Approval</text>
  <text class="sub" x="165" y="633">bound action / risk gate</text>

  <rect class="box" x="310" y="385" width="190" height="78" rx="13"/>
  <text class="label" x="405" y="415">Credential</text>
  <text class="sub" x="405" y="440">identity / audience proof</text>

  <rect class="box" x="310" y="485" width="190" height="78" rx="13"/>
  <text class="label" x="405" y="515">Task + World</text>
  <text class="sub" x="405" y="540">contract / resource version</text>

  <rect class="box" x="310" y="585" width="190" height="62" rx="13"/>
  <text class="label" x="405" y="612">Validity</text>
  <text class="sub" x="405" y="633">expiry · revocation · budget</text>

  <rect class="active" x="560" y="425" width="235" height="160" rx="16"/>
  <text class="label-light" x="677" y="461">Authorization Decision</text>
  <text class="sub-light" x="677" y="488">actor × action × resource</text>
  <text class="sub-light" x="677" y="512">parameters × current context</text>
  <rect x="590" y="532" width="175" height="34" rx="8" fill="#ffffff" opacity=".16"/>
  <text class="sub-light" x="677" y="554">allow / deny / interrupt</text>

  <rect class="soft" x="855" y="425" width="180" height="160" rx="16"/>
  <text class="label" x="945" y="461">Harness</text>
  <text class="sub" x="945" y="488">tool proxy · sandbox</text>
  <text class="sub" x="945" y="512">secret broker · audit</text>
  <text class="sub" x="945" y="536">deterministic</text>
  <text class="sub" x="945" y="559">enforcement point</text>

  <rect class="success" x="1095" y="449" width="115" height="112" rx="16"/>
  <text class="label" x="1152" y="484">Audited</text>
  <text class="label" x="1152" y="507">Effect</text>
  <text class="sub" x="1152" y="535">receipt / version</text>

  <path class="edge-dashed" d="M 260 424 L 285 424 L 285 370 L 525 370 L 559 468"/>
  <path class="edge-dashed" d="M 260 524 L 285 524 L 285 474 L 525 474 L 559 493"/>
  <path class="edge-dashed" d="M 260 616 L 285 616 L 285 660 L 525 660 L 559 542"/>
  <path class="edge-dashed" d="M 500 424 C 530 424, 540 452, 559 480"/>
  <path class="edge-dashed" d="M 500 524 L 559 505"/>
  <path class="edge-dashed" d="M 500 616 C 525 616, 540 570, 559 548"/>
  <path class="edge-dashed" d="M 1137 195 L 1137 285 C 1137 365, 742 344, 742 424"/>
  <text class="edge-label" x="945" y="365">normalize action + parameters</text>
  <path class="edge" d="M 795 505 L 854 505"/>
  <path class="edge" d="M 1035 505 L 1094 505"/>
  <text class="edge-label" x="825" y="491">allow</text>
  <text class="edge-label" x="1065" y="491">execute</text>

  <text class="note-strong" x="560" y="626">Credential ≠ Permission</text>
  <text class="note" x="750" y="626">任一条件缺失都不能由模型补写；Deny 与 Unknown 必须显式返回。</text>

  <rect class="frame" x="35" y="705" width="1210" height="240" rx="24"/>
  <text class="frame-label" x="65" y="740">DELEGATION AND REVOCATION · ATTENUATE RIGHTS, PROPAGATE INVALIDATION</text>

  <rect class="active" x="70" y="788" width="190" height="88" rx="14"/>
  <text class="label-light" x="165" y="820">Parent Grant G1</text>
  <text class="sub-light" x="165" y="844">task scope · depth 2</text>
  <text class="sub-light" x="165" y="864">read + limited write</text>

  <rect class="soft" x="320" y="788" width="190" height="88" rx="14"/>
  <text class="label" x="415" y="820">Child Grant G2</text>
  <text class="sub" x="415" y="844">depth 1 · read only</text>
  <text class="sub" x="415" y="864">G2 ⊆ G1 ∩ assignment</text>

  <rect class="box" x="570" y="788" width="190" height="88" rx="14"/>
  <text class="label" x="665" y="820">Grandchild G3</text>
  <text class="sub" x="665" y="844">depth 0 · test only</text>
  <text class="sub" x="665" y="864">never broader than G2</text>

  <path class="edge" d="M 260 832 L 319 832"/>
  <path class="edge" d="M 510 832 L 569 832"/>
  <text class="edge-label" x="290" y="817">delegate</text>
  <text class="edge-label" x="540" y="817">attenuate</text>

  <rect class="danger" x="830" y="778" width="165" height="108" rx="14"/>
  <text class="label" x="912" y="811">Revocation</text>
  <text class="sub" x="912" y="836">grant / approval / token</text>
  <text class="sub" x="912" y="859">record + propagate</text>

  <rect class="danger" x="1055" y="778" width="155" height="108" rx="14"/>
  <text class="label" x="1132" y="811">Active Work</text>
  <text class="sub" x="1132" y="836">fence new effects</text>
  <text class="sub" x="1132" y="859">reconcile in-flight</text>

  <path class="edge-red-dashed" d="M 912 778 C 912 755, 165 755, 165 787"/>
  <path class="edge-red-dashed" d="M 912 778 C 912 764, 415 764, 415 787"/>
  <path class="edge-red-dashed" d="M 912 778 C 912 772, 665 772, 665 787"/>
  <path class="edge-red" d="M 995 832 L 1054 832"/>
  <text class="edge-label-red" x="1025" y="817">signal</text>
  <text class="note" x="70" y="916">Revoke 阻止未来动作，不回滚既有 Effect；Cancel、Revoke、Reconcile 与 Compensate 必须分开。</text>
</svg>
