<!doctype html>
<html lang="en" data-language="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <script>
      try {
        if (localStorage.getItem("agent-notes-language") === "zh") {
          document.documentElement.dataset.language = "zh";
          document.documentElement.lang = "zh-CN";
        }
      } catch (error) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300,0,0&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n data-en="Skip to content" data-zh="跳到正文">Skip to content</a>

    {% include site-header.html %}

    <div class="docs-shell">
      {% include sidebar.html %}

      <main class="content{% if page.page_class %} {{ page.page_class }}{% endif %}" id="main-content">
        {{ content }}
        {% include site-footer.html %}
      </main>

      {% include page-outline.html %}
    </div>

    <div class="nav-scrim" hidden></div>
    <script src="{{ '/assets/js/language.js' | relative_url }}" defer></script>
  </body>
</html>
