<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
        <span class="brand-mark">A/</span>
        <span>
          <strong>Agent Notes</strong>
          <small>Agent Definition → Agent Framework → Agent Application / Coding Agent</small>
        </span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}">Notes</a>
        <a href="{{ '/ROADMAP/' | relative_url }}">路线图</a>
        <a class="github-link" href="https://github.com/Eddiee-Wei/agent-engineering-notes">GitHub ↗</a>
      </nav>
    </header>

    <div class="page-shell">
      <aside class="side-nav" aria-label="章节目录">
        <a class="side-chapter{% if page.url contains '/docs/' or page.url contains '/agent/' %} is-active{% endif %}" href="{{ '/agent/' | relative_url }}">
          <span class="chapter-number">01</span>
          <span class="chapter-title">Agent Introduction</span>
        </a>
        <a class="side-chapter{% if page.url contains '/frameworks/' or page.url contains '/agent-framework/' %} is-active{% endif %}" href="{{ '/agent-framework/' | relative_url }}">
          <span class="chapter-number">02</span>
          <span class="chapter-title">Agent Framework</span>
        </a>
        <a class="side-chapter{% if page.url contains '/coding-agents/' or page.url contains '/agent-application/' %} is-active{% endif %}" href="{{ '/agent-application/' | relative_url }}">
          <span class="chapter-number">03</span>
          <span class="chapter-title">Agent Application<br><small>/ Coding Agent</small></span>
        </a>
      </aside>

      <main class="content{% if page.page_class %} {{ page.page_class }}{% endif %}">
        {{ content }}
      </main>
    </div>

    <footer class="site-footer">
      <span>Notes on agent systems and coding agents</span>
      <span>Built openly by <a href="https://github.com/Eddiee-Wei">@Eddiee-Wei</a></span>
    </footer>
  </body>
</html>
