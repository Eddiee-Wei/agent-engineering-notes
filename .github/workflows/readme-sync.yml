name: Check README navigation sync

on:
  pull_request:
    paths:
      - "README.md"
      - "_config.yml"
      - "_data/navigation.yml"
      - "agent/**"
      - "docs/**"
      - "agent-framework/**"
      - "frameworks/**"
      - "agent-application/**"
      - "coding-agents/**"
      - "engineering/**"
      - "notes/**"
      - "scripts/sync_readme_navigation.rb"
      - ".github/workflows/readme-sync.yml"
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "_config.yml"
      - "_data/navigation.yml"
      - "agent/**"
      - "docs/**"
      - "agent-framework/**"
      - "frameworks/**"
      - "agent-application/**"
      - "coding-agents/**"
      - "engineering/**"
      - "notes/**"
      - "scripts/sync_readme_navigation.rb"
      - ".github/workflows/readme-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check generated README navigation
        run: ruby scripts/sync_readme_navigation.rb --check
