title: Agent Engineering Notes
description: Notes on Agent fundamentals, frameworks, runtimes, and harnesses.
url: https://eddiee-wei.github.io
baseurl: /agent-engineering-notes
lang: en
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "agent"
    values:
      nav_section: agent
  - scope:
      path: "docs"
    values:
      nav_section: agent
  - scope:
      path: "agent-framework"
    values:
      nav_section: frameworks
  - scope:
      path: "frameworks"
    values:
      nav_section: frameworks
  - scope:
      path: "agent-application"
    values:
      nav_section: applications
  - scope:
      path: "coding-agents"
    values:
      nav_section: applications
  - scope:
      path: "engineering"
    values:
      nav_section: engineering

exclude:
  - .git
  - .github
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - LICENSE
