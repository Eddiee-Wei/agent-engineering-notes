title: Agent 工程实践与研究手记
description: 从 tRPC-Agent-Go 的真实实践出发，记录 Agent 系统的工程判断、源码研究与应用体验。
url: https://eddiee-wei.github.io
baseurl: /agent-tech-share
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - .git
  - .github
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - LICENSE
