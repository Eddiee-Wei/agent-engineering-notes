title: Agent Engineering Notes
description: Notes on agent frameworks, runtimes, harnesses, and coding agents.
url: https://eddiee-wei.github.io
baseurl: /agent-engineering-notes
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - .git
  - .github
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - LICENSE
